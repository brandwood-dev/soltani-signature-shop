name: Production Delivery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-delivery
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Bundle budgets
        run: bun run check:bundle

  deploy:
    name: Deploy and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release
        run: bun run build

      - name: Deploy Cloudflare Worker
        id: deploy
        run: bunx wrangler deploy --config wrangler.jsonc --var "CF_VERSION_SHA:${GITHUB_SHA}"

      - name: Smoke test SHA, homepage and API readiness
        run: bun run verify:production
        env:
          EXPECTED_FRONTEND_SHA: ${{ github.sha }}
          FRONTEND_BASE_URL: https://www.soltanisignature.com
          API_BASE_URL: https://soltani-signature-api.onrender.com

      - name: Automatic rollback
        if: failure() && steps.deploy.outcome == 'success'
        run: bunx wrangler rollback --config wrangler.jsonc --message "Automatic rollback after failed production smoke test"
